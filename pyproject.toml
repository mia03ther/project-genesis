[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-genesis"
dynamic = ["version"]
description = "A deterministic, programmable civilization simulation platform (v0.1 MVP)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
genesis = "genesis.cli:main"

[tool.setuptools]
packages = ["genesis", "genesis.harness"]

[tool.setuptools.dynamic]
version = { attr = "genesis.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "anvil: integration tests that start a local Anvil node (requires Foundry; skipped when anvil is not on PATH)",
]
